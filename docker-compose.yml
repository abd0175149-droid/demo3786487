# ============================================================
# NUSKJO — Docker Compose (Production)
# Port: 4020 → Cloudflare Tunnel → nuskjo.grade.sbs
# ============================================================

services:
  nuskjo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-app
    restart: unless-stopped
    ports:
      - "4040:4020"
    volumes:
      # Persist storage (uploads, logs)
      - demo-storage:/var/www/html/storage
      # Persist SQLite database
      - demo-database:/var/www/html/database
    environment:
      - APP_NAME=DEMO_APP
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://demo.grade.sbs
      - APP_LOCALE=ar
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SAR_TO_JOD=0.19
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4020/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  demo-storage:
    driver: local
  demo-database:
    driver: local
